name: Export Docker Image to Releases

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker 镜像名称 (例如: quay.io/ascend/vllm-ascend:v0.23.0)'
        required: true
        default: 'quay.io/ascend/vllm-ascend:v0.23.0'
      platform:
        description: '目标架构平台'
        required: true
        default: 'linux/arm64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    # 授予 GitHub Actions 写入 Release 的权限
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install regctl
        run: |
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 > regctl
          chmod +x regctl
          sudo mv regctl /usr/local/bin

      - name: Export Docker Image
        run: |
          IMAGE="${{ github.event.inputs.image_name }}"
          PLATFORM="${{ github.event.inputs.platform }}"
          
          # 提取文件名：quay.io/ascend/vllm-ascend:v0.23.0 -> vllm-ascend-v0.23.0.tar
          BASE_NAME=$(echo "$IMAGE" | awk -F'/' '{print $NF}' | tr ':' '-')
          TAR_NAME="${BASE_NAME}.tar"
          
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
          echo "BASE_NAME=$BASE_NAME" >> $GITHUB_ENV
          
          echo "开始导出镜像 $IMAGE ($PLATFORM)..."
          regctl image export --platform "$PLATFORM" --name "$IMAGE" "$IMAGE" "$TAR_NAME"

      - name: Check and Split File if > 2GB
        run: |
          TAR_NAME="$TAR_NAME"
          BASE_NAME="$BASE_NAME"
          
          # 注意：GitHub Release 单个 Asset 文件限制为 2GB，超 2GB 进行切分
          FILE_SIZE=$(stat -c%s "$TAR_NAME")
          TWO_GB=$((2 * 1024 * 1024 * 1024))
          
          mkdir -p output_assets
          
          if [ $FILE_SIZE -gt $TWO_GB ]; then
            echo "文件超过 2GB，开始按 1.8GB 进行切分..."
            split -b 1800M -d "$TAR_NAME" "output_assets/${BASE_NAME}.tar.part"
            rm "$TAR_NAME"
          else
            echo "文件未超过 2GB，直接移动至输出目录..."
            mv "$TAR_NAME" output_assets/
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 以镜像名或时间戳作为 Tag 名称
          tag_name: ${{ env.BASE_NAME }}
          name: "Docker Image: ${{ github.event.inputs.image_name }}"
          body: |
            ## 镜像导出信息
            - **镜像名称**: `${{ github.event.inputs.image_name }}`
            - **平台架构**: `${{ github.event.inputs.platform }}`
            - **导出时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            
            > **提示**：如果是 `.part` 分卷文件，下载后使用命令合并：
            > `cat ${{ env.BASE_NAME }}.tar.part* > ${{ env.BASE_NAME }}.tar`
          files: output_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
